# Icons for names in the chat and the blog: the first mention of each name in a chat reply (or a blog post)
# renders with its icon. Names match whole words, exact case. See content/chat/README.md.
#
# After editing, run `bun run icons` (offline, regenerates src/lib/glossary.generated.json).
# To find new names worth an icon after adding content, run `bun run icons --suggest` and review the diff.
#
# A term is an emoji, or an object with one of:
#   brand: thesvg slug (https://thesvg.org)   variant: a thesvg variant (e.g. mono)   color: true keeps the
#          logo's own colours (automatic for logos with several; one-colour logos take that colour, or white
#          when it's too dark for the page)   mono: true draws a one-colour logo in the text colour instead
#   image: file in public/assets/logos, with width/height (logos are trimmed to 128px tall)
#   map: a place to search on Google Maps (icon + link)
#   favicon: a host whose favicon is the icon instead (no link)
#   emoji: an emoji (same as the short form)
#   nmark: true (the site's own N, for things that are part of the site)
# plus optional href (link the name; brand names aren't linked by default), aliases, sites (links to these
# hosts show this icon instead of their favicon, so GitHub looks the same as a name and as a link),
# id (defaults to the name in kebab-case), and auto: false (also an ordinary word: only where marked).
#
# The one marker, the same in chat content, blog posts and the chat model's replies:
#   [Go](@go)    this mention gets term `go`'s icon (how auto: false names get one; --suggest writes these)
#   [Sure](@-)   this mention stays plain

